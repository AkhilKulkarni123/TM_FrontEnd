<!--
  Question Template for Snakes and Ladders

  This generic template displays a question based on query parameters in the URL.
  Expected parameters:
    - row (1–5)
    - index (0–9)
    - square (6–55) [optional; auto-derived if missing]

  It loads question data from:
    hacks/snakes/questions/questions_bank.js

  On submit, it calls:
    POST /api/snakes/answer-question
  and then returns the player to:
    ../game-board-part2.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snakes and Ladders Question</title>

  <!-- Shared game styles -->
  <link rel="stylesheet" href="../../../assets/css/snakes-game.css">
  <link rel="stylesheet" href="../../../assets/css/lesson-arcade.css">

  <style>
    .question-page {
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
    }
    .question-shell .question-card {
      color: #2b2c4a;
    }
    .options label {
      display: block;
      margin-bottom: 0.5rem;
      cursor: pointer;
      background: rgba(44, 63, 105, 0.08);
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .options label:hover {
      transform: translateX(4px);
      background: rgba(90, 107, 176, 0.2);
    }
    #submit-btn {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      background: linear-gradient(135deg, #ff9966, #ff5e62);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 15px 35px rgba(255, 94, 98, 0.4);
    }
    #submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .meta { margin-top: 0.75rem; font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body class="question-page">
  <div class="question-shell">
    <div class="arcade-zone question-arcade" data-arcade-target="3" data-arcade-message="Collect energy cores to unlock the question!" data-arcade-complete="Energy charged! Answer the question below.">
      <div class="arcade-header">
        <h2>Mini Challenge</h2>
        <p>Use WASD or arrow keys to move your selected character through the grid.</p>
      </div>
      <div class="arcade-grid"></div>
      <div class="arcade-status">Collect every core.</div>
    </div>
    <div id="question-container" class="question-card">
    <h2 id="question-title">Question</h2>
    <p id="question-text"></p>
    <div id="options" class="options"></div>
    <button id="submit-btn">Submit Answer</button>
    <div class="meta" id="question-meta"></div>
  </div>
  </div>

  <!-- Load the external question bank -->
  <script src="questions_bank.js"></script>
  <script src="../../../assets/js/lesson-arcade.js"></script>

  <script>
    // IMPORTANT: use localhost (not 127.0.0.1) so JWT cookie matches domain
    const API_URL = 'http://localhost:8306/api';

    // Parse query parameters
    const params = new URLSearchParams(window.location.search);
    const row = parseInt(params.get('row'), 10) || 1;       // 1..5
    const index = parseInt(params.get('index'), 10) || 0;   // 0..9 (10 columns)

    // If square isn't passed, derive it from row/index: section 2 begins at square 6 (0-based indexing with START at 0)
      const SECTION2_START = 6; // first question square (section 2 start)
    const derivedSquare = SECTION2_START + ((row - 1) * 10) + index;
    const square = parseInt(params.get('square'), 10) || derivedSquare;

    // Load question from bank
    const BANK = window.QUESTIONS_BANK;

    if (!BANK || !BANK[row] || !BANK[row][index]) {
      console.error("Missing question data for row/index:", row, index, BANK);
      alert("Question data missing. Please check questions_bank.js.");
      window.location.href = '../game-board-part2.html';
    }

    const question = BANK[row][index];

    // Update arcade mini-game messaging before SnakesArcade initializes
    var arcadeZone = document.querySelector('.question-arcade');
    if (arcadeZone) {
      var arcadeModes = ['orb', 'sequence', 'tic'];
      var chosenMode = arcadeModes[Math.abs(square + row + index) % arcadeModes.length];
      arcadeZone.dataset.arcadeMode = chosenMode;
      arcadeZone.querySelector('.arcade-header h2').textContent = 'Square ' + square + ' Mini Challenge';

      if (chosenMode === 'sequence') {
        arcadeZone.dataset.arcadeTarget = 4;
        arcadeZone.dataset.arcadeMessage = 'Memorize the flashing arrow pattern to prime your brain.';
        arcadeZone.dataset.arcadeComplete = 'Pattern locked! Time to answer.';
      } else if (chosenMode === 'tic') {
        arcadeZone.dataset.arcadeMessage = 'Win a quiz-powered tic-tac-toe match to earn your attempt.';
        arcadeZone.dataset.arcadeComplete = 'Nice victory! Answer to collect bullets.';
      } else {
        arcadeZone.dataset.arcadeMessage = 'Move your hero with WASD or arrows while you prep for row ' + row + '.';
        arcadeZone.dataset.arcadeComplete = 'Nice run! Now answer the question to earn bullets.';
      }
    }

    // Render UI
    document.getElementById('question-title').innerText = `Lesson ${row} • Question ${index + 1}`;
    document.getElementById('question-text').innerText = question.prompt;

    const meta = document.getElementById('question-meta');
    meta.innerText = `Square: ${square} (Row ${row}, Index ${index})`;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    question.options.forEach((opt, i) => {
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'answer';
      radio.value = i;
      label.appendChild(radio);
      label.appendChild(document.createTextNode(' ' + opt));
      optionsDiv.appendChild(label);
    });

    // Submit handler
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.addEventListener('click', async () => {
      const selected = document.querySelector('input[name="answer"]:checked');
      if (!selected) {
        alert('Please select an answer.');
        return;
      }

      submitBtn.disabled = true;

      const chosen = parseInt(selected.value, 10);
      const correct = (chosen === question.answer);
      const bullets = correct ? 2 : 0;

      try {
        const res = await fetch(`${API_URL}/snakes/answer-question`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            // convert to server's 1-based numbering
            square: Number(square) + 1,
            row: row,
            question_index: index,
            correct: correct,
            bullets_earned: bullets
          })
        });

        if (res.ok) {
          alert(correct ? 'Correct! You earned 2 bullets.' : 'Incorrect. No bullets awarded.');
          window.location.href = '../game-board-part2.html';
          return;
        }

        const data = await res.json().catch(() => ({}));
        alert(data.error || data.message || 'Error submitting answer.');

      } catch (err) {
        console.error(err);
        alert('Network error.');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
