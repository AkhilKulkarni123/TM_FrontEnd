<!--
  Question Template for Snakes and Ladders

  This generic template displays a question based on query parameters in the
  URL.  It expects three parameters: row (1–5), index (0–4) and square
  (26–50).  The row determines the lesson topic and pulls the
  appropriate question from a predefined question bank.  After the
  player submits an answer, the template calls the backend endpoint
  /api/snakes/answer-question to record whether the answer was correct
  and award bullets.  Upon completion the user is returned to the
  second half of the board.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes and Ladders Question</title>
    <!-- Use a relative path to load the shared game styles -->
    <!-- Load the shared game styles from the assets directory.  Because this
         question template lives in hacks/snakes/questions, we must go up
         three directories (questions → snakes → hacks → frontend) to reach
         frontend/assets/css/snakes-game.css. -->
    <link rel="stylesheet" href="../../../assets/css/snakes-game.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .question-card { background: #f4f4f4; padding: 1rem; border-radius: 4px; }
        .options label { display: block; margin-bottom: 0.5rem; }
        #submit-btn { margin-top: 1rem; padding: 0.5rem 1rem; background: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="question-container" class="question-card">
        <h2 id="question-title">Question</h2>
        <p id="question-text"></p>
        <div id="options" class="options"></div>
        <button id="submit-btn">Submit Answer</button>
    </div>

    <script>
    // Question bank: five questions per lesson row.  Modify or extend
    // these questions as needed.  Each object has a prompt, an array of
    // options and the index of the correct answer.
    const QUESTION_BANK = {
        1: [
            {
                prompt: 'Which keyword declares a constant in JavaScript?',
                options: ['var', 'const', 'let', 'static'],
                answer: 1
            },
            {
                prompt: 'A loop that continues until a condition is false is called?',
                options: ['for loop', 'while loop', 'condition loop', 'iterate loop'],
                answer: 1
            },
            {
                prompt: 'What symbol begins a single line comment in JavaScript?',
                options: ['//', '<!--', '#', '/*'],
                answer: 0
            },
            {
                prompt: 'Which of these values is a string?',
                options: ['42', "'Hello'", 'true', 'undefined'],
                answer: 1
            },
            {
                prompt: 'What does an if statement do?',
                options: ['Executes code repeatedly', 'Stores data', 'Makes decisions', 'Declares functions'],
                answer: 2
            }
        ],
        2: [
            {
                prompt: 'What index is the first element of an array located at?',
                options: ['0', '1', '-1', 'Depends on language'],
                answer: 0
            },
            {
                prompt: 'Which syntax creates an empty object in JavaScript?',
                options: ['[]', '{}', '()', '<>'],
                answer: 1
            },
            {
                prompt: 'Which method adds an element to the end of an array?',
                options: ['push()', 'pop()', 'shift()', 'unshift()'],
                answer: 0
            },
            {
                prompt: 'What property returns the number of items in an array?',
                options: ['size', 'count', 'length', 'index'],
                answer: 2
            },
            {
                prompt: 'Objects store data in what form?',
                options: ['Indexed pairs', 'Key-value pairs', 'Numeric values', 'Sequential bytes'],
                answer: 1
            }
        ],
        3: [
            {
                prompt: 'Which protocol is used to transfer web pages?',
                options: ['FTP', 'HTTP', 'SMTP', 'TCP'],
                answer: 1
            },
            {
                prompt: 'An IPv4 address contains how many bits?',
                options: ['16', '32', '64', '128'],
                answer: 1
            },
            {
                prompt: 'DNS stands for?',
                options: ['Domain Name System', 'Data Network Service', 'Digital Network Server', 'Dynamic Name Standard'],
                answer: 0
            },
            {
                prompt: 'Which device forwards packets between networks?',
                options: ['Switch', 'Modem', 'Router', 'Repeater'],
                answer: 2
            },
            {
                prompt: 'Which port does HTTP use by default?',
                options: ['21', '53', '80', '443'],
                answer: 2
            }
        ],
        4: [
            {
                prompt: 'What is a common method of securing a password?',
                options: ['Storing it in plain text', 'Hashing it', 'Writing it on paper', 'Sending it via email'],
                answer: 1
            },
            {
                prompt: 'Which protocol secures web traffic?',
                options: ['HTTP', 'FTP', 'HTTPS', 'SMTP'],
                answer: 2
            },
            {
                prompt: 'Malware that encrypts your files and demands payment is called?',
                options: ['Spyware', 'Adware', 'Ransomware', 'Worm'],
                answer: 2
            },
            {
                prompt: 'Strong encryption relies on what?',
                options: ['Weak keys', 'Short passwords', 'Hard‑to‑guess keys', 'Open ports'],
                answer: 2
            },
            {
                prompt: 'A computer virus is?',
                options: ['A hardware failure', 'A harmless game', 'Self‑replicating malware', 'A security update'],
                answer: 2
            }
        ],
        5: [
            {
                prompt: 'Big data analytics often relies on?',
                options: ['Manual counting', 'Cloud computing', 'Floppy disks', 'Paper charts'],
                answer: 1
            },
            {
                prompt: 'Bias in algorithms can lead to?',
                options: ['Fair outcomes', 'Neutral decisions', 'Discriminatory results', 'Faster computation'],
                answer: 2
            },
            {
                prompt: 'Which of the following is a potential risk of collecting personal data?',
                options: ['Improved privacy', 'Personalised services', 'Data breaches', 'Infinite storage'],
                answer: 2
            },
            {
                prompt: 'Ethical computing emphasises?',
                options: ['Profit over people', 'Openness about data usage', 'Removing encryption', 'Ignoring consent'],
                answer: 1
            },
            {
                prompt: 'What is anonymisation?',
                options: ['Collecting all data', 'Removing personal identifiers', 'Encrypting every file', 'Destroying data'],
                answer: 1
            }
        ]
    };

    // Parse query parameters
    const params = new URLSearchParams(window.location.search);
    const row = parseInt(params.get('row')) || 1;
    const index = parseInt(params.get('index')) || 0;
    const square = parseInt(params.get('square')) || (25 + ((row - 1) * 5) + index + 1);

    const question = QUESTION_BANK[row][index];
    document.getElementById('question-title').innerText = `Lesson ${row} Question ${index + 1}`;
    document.getElementById('question-text').innerText = question.prompt;
    const optionsDiv = document.getElementById('options');
    question.options.forEach((opt, i) => {
        const label = document.createElement('label');
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'answer';
        radio.value = i;
        label.appendChild(radio);
        label.appendChild(document.createTextNode(' ' + opt));
        optionsDiv.appendChild(label);
    });

    const API_URL = 'http://localhost:8001/api';
    document.getElementById('submit-btn').addEventListener('click', async () => {
        const selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) {
            alert('Please select an answer.');
            return;
        }
        const correct = (parseInt(selected.value) === question.answer);
        const bullets = correct ? 2 : 0;
        try {
            const res = await fetch(`${API_URL}/snakes/answer-question`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    square: square,
                    row: row,
                    question_index: index,
                    correct: correct,
                    bullets_earned: bullets
                })
            });
            if (res.ok) {
                if (correct) {
                    alert('Correct! You earned 2 bullets.');
                } else {
                    alert('Incorrect. No bullets awarded.');
                }
                // Return to second half board
                window.location.href = '../game-board-part2.html';
            } else {
                const data = await res.json();
                alert(data.error || 'Error submitting answer.');
            }
        } catch (err) {
            console.error(err);
            alert('Network error.');
        }
    });
    </script>
</body>
</html>
