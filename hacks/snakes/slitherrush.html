<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLITHERRUSH</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/snakes-theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #040c17;
            color: #e9f7ff;
            font-family: 'Rajdhani', sans-serif;
        }

        #srRoot {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #srCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: radial-gradient(circle at 25% 15%, rgba(34, 102, 164, 0.32), rgba(5, 10, 20, 0.98));
        }

        .sr-panel {
            background: rgba(7, 14, 26, 0.78);
            border: 1px solid rgba(189, 233, 255, 0.22);
            border-radius: 14px;
            backdrop-filter: blur(9px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.42);
        }

        .sr-top {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: grid;
            grid-template-columns: 320px 320px;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }

        .sr-top .sr-panel {
            padding: 10px 12px;
            pointer-events: auto;
        }

        .sr-title {
            font-family: 'Oxanium', sans-serif;
            margin: 0;
            letter-spacing: 1.2px;
            font-size: 18px;
        }

        .sr-sub {
            margin: 2px 0 0;
            color: rgba(225, 245, 255, 0.76);
            font-size: 12px;
            letter-spacing: 0.6px;
        }

        .sr-quick-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(80px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .sr-pill {
            border: 1px solid rgba(180, 231, 255, 0.2);
            border-radius: 10px;
            padding: 8px;
            background: rgba(11, 20, 35, 0.72);
            text-align: center;
        }

        .sr-pill-label {
            display: block;
            font-size: 11px;
            color: rgba(208, 238, 255, 0.7);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .sr-pill-value {
            display: block;
            font-family: 'Oxanium', sans-serif;
            font-size: 20px;
            margin-top: 2px;
        }

        #srLeaderboardList {
            margin-top: 8px;
            display: grid;
            gap: 6px;
        }

        .sr-leaderboard-row {
            border-radius: 9px;
            border: 1px solid rgba(188, 232, 255, 0.2);
            background: rgba(9, 17, 30, 0.8);
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .sr-leaderboard-row.self {
            border-color: rgba(255, 220, 132, 0.55);
            background: rgba(53, 39, 12, 0.46);
        }

        .sr-leaderboard-empty {
            color: rgba(210, 237, 255, 0.66);
            text-align: center;
            font-size: 13px;
            padding: 10px 0;
        }

        .sr-controls {
            position: absolute;
            left: 14px;
            bottom: 14px;
            display: flex;
            gap: 8px;
        }

        .sr-controls button {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(183, 230, 255, 0.3);
            background: rgba(10, 18, 31, 0.82);
            color: #e9f7ff;
            cursor: pointer;
        }

        .sr-controls button:hover {
            background: rgba(29, 45, 70, 0.9);
        }

        .sr-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(2, 8, 16, 0.7);
            z-index: 10;
        }

        .sr-overlay.active {
            display: flex;
        }

        .sr-overlay-card {
            width: min(480px, calc(100% - 28px));
            border-radius: 18px;
            border: 1px solid rgba(201, 238, 255, 0.28);
            background: rgba(8, 14, 26, 0.92);
            padding: 24px;
            text-align: center;
            box-shadow: 0 24px 52px rgba(0, 0, 0, 0.48);
        }

        .sr-overlay-title {
            margin: 0;
            font-family: 'Oxanium', sans-serif;
            letter-spacing: 1.4px;
            font-size: 27px;
        }

        .sr-overlay-sub {
            margin: 8px 0 0;
            font-size: 15px;
            color: rgba(212, 239, 255, 0.78);
        }

        #srEndResults {
            margin-top: 12px;
            display: grid;
            gap: 6px;
            text-align: left;
        }

        .sr-result-row {
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(192, 232, 255, 0.2);
            border-radius: 10px;
            padding: 7px 8px;
            background: rgba(11, 21, 36, 0.76);
        }

        .sr-hint {
            margin-top: 10px;
            font-size: 12px;
            color: rgba(213, 238, 255, 0.68);
            letter-spacing: 0.3px;
        }

        @media (max-width: 980px) {
            .sr-top {
                grid-template-columns: 1fr;
                right: 10px;
                left: 10px;
            }

            .sr-controls {
                left: 10px;
                bottom: 10px;
            }

            .sr-controls button {
                font-size: 13px;
                padding: 7px 10px;
            }
        }
    </style>
</head>
<body class="snakes-theme slitherrush-mode">
    <div id="srRoot">
        <canvas id="srCanvas"></canvas>

        <div class="sr-top">
            <section class="sr-panel">
                <h1 class="sr-title">SLITHERRUSH</h1>
                <p class="sr-sub" id="srConnectionStatus">Connecting...</p>
                <div class="sr-quick-stats">
                    <div class="sr-pill">
                        <span class="sr-pill-label">Length</span>
                        <span class="sr-pill-value" id="srLengthValue">0</span>
                    </div>
                    <div class="sr-pill">
                        <span class="sr-pill-label">Score</span>
                        <span class="sr-pill-value" id="srScoreValue">0</span>
                    </div>
                    <div class="sr-pill">
                        <span class="sr-pill-label">Alive</span>
                        <span class="sr-pill-value" id="srAliveValue">0</span>
                    </div>
                </div>
                <div class="sr-hint">
                    State: <strong id="srStateLabel">WAITING</strong> · Timer: <strong id="srMatchTimerValue">00:00</strong>
                </div>
            </section>

            <section class="sr-panel">
                <h2 class="sr-title">Live Leaderboard</h2>
                <p class="sr-sub">Top 5 slithers in real time</p>
                <div id="srLeaderboardList"></div>
            </section>
        </div>

        <div class="sr-controls">
            <button id="srLeaveBtn">Leave Arena</button>
            <button id="srBackBtn">Back to Modes</button>
        </div>

        <div class="sr-overlay" id="srDeathOverlay">
            <div class="sr-overlay-card">
                <h2 class="sr-overlay-title" id="srDeathText">YOU WERE ELIMINATED</h2>
                <p class="sr-overlay-sub" id="srSpectatingText">SPECTATING: --</p>
                <p class="sr-hint">Press <strong>Q</strong> / <strong>E</strong> to switch spectator target.</p>
            </div>
        </div>

        <div class="sr-overlay" id="srEndOverlay">
            <div class="sr-overlay-card">
                <h2 class="sr-overlay-title">MATCH COMPLETE</h2>
                <p class="sr-overlay-sub" id="srEndReason">Results</p>
                <div id="srEndResults"></div>
                <div class="sr-controls" style="position: static; justify-content: center; margin-top: 12px;">
                    <button id="srPlayAgainBtn">Play Again</button>
                    <button id="srBackBtnSecondary" onclick="window.location.href='mode-selection.html';">Back to Modes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/slitherrush/slitherrush_client.js"></script>
    <script src="../../assets/js/slitherrush/slitherrush_input.js"></script>
    <script src="../../assets/js/slitherrush/slitherrush_renderer.js"></script>
    <script src="../../assets/js/slitherrush/slitherrush_ui.js"></script>
    <script src="../../assets/js/slitherrush/slitherrush_main.js"></script>
</body>
</html>
