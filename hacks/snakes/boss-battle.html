<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Battle - Final Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            color: white;
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #0f3460 0%, #1a1a2e 100%);
            border: 3px solid #e94560;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(233, 69, 96, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            min-width: 150px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .health-bar {
            width: 300px;
            height: 30px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            transition: width 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .message-box {
            animation: bounce 0.5s ease;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .btn {
            padding: 15px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            display: none;
        }

        .game-over h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .message-box {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(233, 69, 96, 0.95);
            padding: 15px 30px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="hud">
        <div class="stat-box">
            <div class="stat-label">Boss Health</div>
            <div class="health-bar">
                <div class="health-fill" id="bossHealth" style="width: 100%"></div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Your Lives</div>
            <div class="stat-value">❤️ <span id="playerLives">3</span></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">💰 Bullets</div>
            <div class="stat-value" id="bulletsCount">50</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div style="margin-bottom: 15px; font-size: 1.2em;">
            Use WASD or Arrow Keys to move | SPACE to shoot
        </div>
        <button class="btn" onclick="startBattle()" id="startBtn">⚔️ Start Battle</button>
        <button class="btn" onclick="leaveBattle()">🚪 Leave Arena</button>
    </div>

    <div class="message-box" id="messageBox"></div>

    <div class="game-over" id="gameOver">
        <h1 id="gameOverTitle">Victory!</h1>
        <p id="gameOverText" style="font-size: 1.5em; margin-bottom: 30px;"></p>
        <button class="btn" onclick="returnToBoard()">Return to Board</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const IS_LOCAL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        const GAME_API_BASE = IS_LOCAL ? 'http://localhost:8306' : 'https://snakes.opencodingsociety.com';
        const BOSS_API_BASE = IS_LOCAL ? 'http://localhost:8306' : 'https://snakes.opencodingsociety.com';
        const GAME_API_ROOT = GAME_API_BASE + '/api';
        const BOSS_API_ROOT = BOSS_API_BASE + '/api';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 200;

        let gameActive = false;
        let roomId = null;
        let ws = null;
        let roomPollInterval = null;
        const DEFAULT_LIVES = 3;
        const CHARACTER_CONFIG = {
            knight: { icon: '🛡️', color: '#4facfe', glow: '#4facfe', name: 'Knight' },
            wizard: { icon: '🧙', color: '#8e44ad', glow: '#9b59b6', name: 'Wizard' },
            archer: { icon: '🏹', color: '#2ecc71', glow: '#27ae60', name: 'Archer' },
            warrior: { icon: '⚔️', color: '#f39c12', glow: '#f1c40f', name: 'Warrior' }
        };

        const gameState = {
            player: {
                x: canvas.width / 2,
                y: canvas.height - 100,
                size: 35,  // Increased from 30 to 35
                speed: 6,   // Increased from 5 to 6
                lives: 3,
                bullets: 50,
                character: 'knight', // Add this line
                color: '#4facfe'
            },
            boss: {
                x: canvas.width / 2,
                y: 100,
                size: 90,   // Increased from 80 to 90
                health: 1000,
                maxHealth: 1000,
                angle: 0,    // For rotation
                moveDirection: 1,  // 1 = right, -1 = left
                moveSpeed: 2,      // Horizontal movement speed
                verticalDirection: 1, // 1 = down, -1 = up
                verticalSpeed: 0.5    // Vertical movement speed
            },
            playerBullets: [],
            bossProjectiles: [],
            keys: {},
            players: []
        };

        function savePlayerState(overrides) {
            const payload = Object.assign({
                total_bullets: Math.max(0, Math.floor(gameState.player.bullets)),
                lives: Math.max(0, Math.floor(gameState.player.lives))
            }, overrides || {});

            return fetch(`${GAME_API_ROOT}/snakes/`, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(function (err) {
                console.error('Failed to save player state', err);
            });
        }

        // Populate initial player bullets / lives from saved progress if available
        fetch(GAME_API_ROOT + '/snakes/', { credentials: 'include' })
            .then(function (res) { if (!res.ok) return null; return res.json(); })
            .then(function (data) {
                if (!data) return;
                console.log('Loaded player data:', data);
        
        // Load character selection
        if (data.selected_character) {
            gameState.player.character = data.selected_character;
            const charConfig = CHARACTER_CONFIG[data.selected_character];
            if (charConfig) {
                gameState.player.color = charConfig.color;
                console.log('✅ Character loaded:', charConfig.name);
            }
        }
        
            if (typeof data.total_bullets !== 'undefined') {
                gameState.player.bullets = Number(data.total_bullets || 0);
                updateBulletsDisplay();
        }
            if (typeof data.lives !== 'undefined') {
                gameState.player.lives = Number(data.lives || gameState.player.lives);
                updateLives();
        }
        })
            .catch(function (err) { console.error('Could not load player progress', err); });
        window.addEventListener('keydown', (e) => gameState.keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => gameState.keys[e.key.toLowerCase()] = false);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameActive) {
                e.preventDefault();
                shoot();
            }
        });

        async function startBattle() {
            try {
                const response = await fetch(`${BOSS_API_ROOT}/boss/join`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    roomId = data.room_id;
                    syncBossState(data.room, data.players);
                    pollRoomState();
                    startRoomPolling();
                    connectWebSocket();
                    gameActive = true;
                    document.getElementById('startBtn').disabled = true;
                    gameLoop();
                }
            } catch (error) {
                console.error('Join battle error:', error);
                gameActive = true;
                gameLoop();
            }
        }

        function connectWebSocket() {
            var wsProtocol = BOSS_API_BASE.startsWith('https') ? 'wss' : 'ws';
            var wsUrl = BOSS_API_BASE.replace(/^https?/, wsProtocol) + '/ws/boss';
            ws = new WebSocket(wsUrl);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'boss_health') {
                    gameState.boss.health = data.health;
                    updateBossHealthBar();
                }
                else if (data.type === 'player_hit') {
                    if (data.player === 'you') {
                        gameState.player.lives--;
                        updateLives();
                        savePlayerState();
                        showMessage('💥 You were hit!');
                    } else {
                        showMessage(`💀 ${data.player} was hit!`);
                    }
                }
                else if (data.type === 'player_died') {
                    showMessage(`☠️ ${data.player} has fallen!`);
                    updatePlayersList();
                    // If this client died, respawn them back to start of section 2
                        if (data.player === 'you') {
                        const SECTION2_START = 6; // square where section 2 begins (0-based scheme) (START at 0, lessons 1-5)
                        // Fetch current progress to determine first unvisited square in section 2
                        fetch(GAME_API_ROOT + '/snakes/', { credentials: 'include' })
                            .then(function (res) { if (!res.ok) return null; return res.json(); })
                            .then(function (data) {
                                var visitedRaw = (data && data.visited_squares) ? data.visited_squares : [];
                                // convert server 1-based visited_squares to 0-based
                                var visited = visitedRaw.map(function (s) { return Number(s) - 1; });
                                var firstUnvisited = SECTION2_START;
                                // Find the first unvisited square in section 2
                                for (var s = SECTION2_START; s < SECTION2_START + 50; s++) {
                                    if (visited.indexOf(s) === -1) { firstUnvisited = s; break; }
                                }
                                // Update server with new current square (convert to 1-based)
                                gameState.player.lives = DEFAULT_LIVES;
                                updateLives();
                                fetch(GAME_API_ROOT + '/snakes/', {
                                    method: 'PUT',
                                    credentials: 'include',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({ current_square: Number(firstUnvisited) + 1, lives: DEFAULT_LIVES })
                                }).catch(function (err) { console.error('Respawn update failed', err); });

                                // Redirect back to section 2 board and show a respawn message
                                setTimeout(function () {
                                    alert('You have fallen in the boss fight. You have been returned to Section 2.');
                                    window.location.href = 'game-board-part2.html';
                                }, 800);
                            }).catch(function (err) {
                                console.error('Error fetching progress for respawn', err);
                                // Fallback: set to SECTION2_START (convert to 1-based)
                                gameState.player.lives = DEFAULT_LIVES;
                                updateLives();
                                fetch(GAME_API_ROOT + '/snakes/', {
                                    method: 'PUT',
                                    credentials: 'include',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({ current_square: Number(SECTION2_START) + 1, lives: DEFAULT_LIVES })
                                }).catch(function () {});
                                setTimeout(function () { window.location.href = 'game-board-part2.html'; }, 800);
                            });
                    }
                }
                else if (data.type === 'boss_defeated') {
                    endGame(true);
                }
                else if (data.type === 'players_update') {
                    syncBossState(null, data.players);
                }
            };
        }

        function syncBossState(room, players) {
            if (room) {
                if (typeof room.boss_health === 'number') gameState.boss.health = room.boss_health;
                if (typeof room.max_boss_health === 'number') gameState.boss.maxHealth = room.max_boss_health;
                updateBossHealthBar();
            }
            if (Array.isArray(players)) {
                gameState.players = players;
                updatePlayersList();
            }
        }

        function pollRoomState() {
            if (!roomId) return;
            fetch(`${BOSS_API_ROOT}/boss/room/${roomId}`, { credentials: 'include' })
                .then(function (res) { if (!res.ok) throw new Error('room poll failed'); return res.json(); })
                .then(function (data) {
                    syncBossState(data.room, data.players);
                })
                .catch(function (err) { console.warn('Boss room poll error:', err); });
        }

        function startRoomPolling() {
            if (roomPollInterval) clearInterval(roomPollInterval);
            roomPollInterval = setInterval(pollRoomState, 5000);
        }

        function stopRoomPolling() {
            if (roomPollInterval) {
                clearInterval(roomPollInterval);
                roomPollInterval = null;
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            movePlayer();
            moveBoss();  // Added boss movement
            moveBullets();
            moveBossProjectiles();
            spawnBossProjectiles();
            drawGame();
            checkCollisions();

            requestAnimationFrame(gameLoop);
        }

        function movePlayer() {
            if (gameState.keys['a'] || gameState.keys['arrowleft']) {
                gameState.player.x = Math.max(gameState.player.size, gameState.player.x - gameState.player.speed);
            }
            if (gameState.keys['d'] || gameState.keys['arrowright']) {
                gameState.player.x = Math.min(canvas.width - gameState.player.size, gameState.player.x + gameState.player.speed);
            }
            if (gameState.keys['w'] || gameState.keys['arrowup']) {
                gameState.player.y = Math.max(gameState.player.size + 200, gameState.player.y - gameState.player.speed);
            }
            if (gameState.keys['s'] || gameState.keys['arrowdown']) {
                gameState.player.y = Math.min(canvas.height - gameState.player.size, gameState.player.y + gameState.player.speed);
            }
        }

        function shoot() {
            if (gameState.player.bullets > 0) {
                gameState.playerBullets.push({
                    x: gameState.player.x,
                    y: gameState.player.y - gameState.player.size,
                    size: 8,
                    speed: 8
                });
                gameState.player.bullets--;
                updateBulletsDisplay();
                savePlayerState();
                
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({type: 'shoot', bullets: gameState.player.bullets}));
                }
            }
        }

        function moveBullets() {
            gameState.playerBullets = gameState.playerBullets.filter(bullet => {
                bullet.y -= bullet.speed;
                return bullet.y > 0;
            });
        }

        function moveBossProjectiles() {
            gameState.bossProjectiles = gameState.bossProjectiles.filter(proj => {
                proj.y += proj.speed;
                proj.x += proj.dx;
                return proj.y < canvas.height;
            });
        }

        function spawnBossProjectiles() {
            // Increased spawn rate from 0.02 to 0.06 (3x more frequent)
            if (Math.random() < 0.06) {
                const angle = Math.random() * Math.PI / 2 + Math.PI / 4;
                gameState.bossProjectiles.push({
                    x: gameState.boss.x,
                    y: gameState.boss.y + gameState.boss.size,
                    size: 12,
                    speed: 5,  // Increased from 4 to 5
                    dx: Math.cos(angle) * 2.5 - 1.25  // Wider spread
                });
            }
            // Occasionally spawn a burst of projectiles
            if (Math.random() < 0.01) {
                for (let i = 0; i < 3; i++) {
                    const burstAngle = (Math.PI / 4) + (i * Math.PI / 4);
                    gameState.bossProjectiles.push({
                        x: gameState.boss.x,
                        y: gameState.boss.y + gameState.boss.size,
                        size: 10,
                        speed: 4,
                        dx: Math.cos(burstAngle) * 2 - 1
                    });
                }
            }
        }

        function moveBoss() {
            const boss = gameState.boss;
            const margin = 100;  // Keep boss away from edges

            // Horizontal movement
            boss.x += boss.moveSpeed * boss.moveDirection;

            // Bounce off walls
            if (boss.x >= canvas.width - margin) {
                boss.moveDirection = -1;
            } else if (boss.x <= margin) {
                boss.moveDirection = 1;
            }

            // Vertical movement (slight bobbing)
            boss.y += boss.verticalSpeed * boss.verticalDirection;

            // Vertical bounds (keep boss in upper portion of screen)
            if (boss.y >= 180) {
                boss.verticalDirection = -1;
            } else if (boss.y <= 80) {
                boss.verticalDirection = 1;
            }
        }

        function checkCollisions() {
            gameState.playerBullets = gameState.playerBullets.filter(bullet => {
                const distance = Math.hypot(bullet.x - gameState.boss.x, bullet.y - gameState.boss.y);
                if (distance < gameState.boss.size) {
                    gameState.boss.health = Math.max(0, gameState.boss.health - 10);
                    updateBossHealthBar();
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({type: 'damage', amount: 10}));
                    }
                    
                    if (gameState.boss.health <= 0) {
                        endGame(true);
                    }
                    return false;
                }
                return true;
            });

            gameState.bossProjectiles.forEach(proj => {
                const distance = Math.hypot(proj.x - gameState.player.x, proj.y - gameState.player.y);
                if (distance < gameState.player.size + proj.size) {
                    gameState.player.lives--;
                    updateLives();
                    savePlayerState();
                    proj.y = canvas.height + 100;
                    
                    if (gameState.player.lives <= 0) {
                        endGame(false);
                    }
                }
            });
        }

        function drawGame() {
            // Draw boss with rotation and glow
            gameState.boss.angle += 0.01;
            
            // Boss glow effect
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#e94560';
            
            // Boss body
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(gameState.boss.x, gameState.boss.y, gameState.boss.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Boss icon (rotating snake)
            ctx.save();
            ctx.translate(gameState.boss.x, gameState.boss.y);
            ctx.rotate(gameState.boss.angle);
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐍', 0, 0);
            ctx.restore();

            // ===== PLAYER CHARACTER DRAWING (FIXED) =====
            const charConfig = CHARACTER_CONFIG[gameState.player.character];
            
            // Player glow circle behind character
            ctx.shadowBlur = 25;
            ctx.shadowColor = charConfig ? charConfig.glow : gameState.player.color;
            ctx.fillStyle = charConfig ? charConfig.color : gameState.player.color;
            ctx.globalAlpha = 0.3; // Make circle semi-transparent
            ctx.beginPath();
            ctx.arc(gameState.player.x, gameState.player.y, gameState.player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0; // Reset transparency
            
            // Draw the actual character ICON (big and clear)
            ctx.shadowBlur = 15;
            ctx.shadowColor = charConfig ? charConfig.glow : '#ffffff';
            ctx.font = 'bold 50px Arial'; // Make it BIGGER
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff'; // White so emoji shows clearly
            ctx.fillText(charConfig ? charConfig.icon : '🙂', gameState.player.x, gameState.player.y);
            ctx.shadowBlur = 0;

            // Player bullets with glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#FFD700';
            ctx.fillStyle = '#FFD700';
            gameState.playerBullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Boss projectiles with glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#e94560';
            ctx.fillStyle = '#e94560';
            gameState.bossProjectiles.forEach(proj => {
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
        }

        function updateBossHealthBar() {
            const percentage = (gameState.boss.health / gameState.boss.maxHealth) * 100;
            document.getElementById('bossHealth').style.width = percentage + '%';
        }

        function updateLives() {
            document.getElementById('playerLives').textContent = gameState.player.lives;
        }

        function updateBulletsDisplay() {
            document.getElementById('bulletsCount').textContent = gameState.player.bullets;
        }

        function updatePlayersList() {
            // Players list panel removed - this function now just tracks player data internally
            // The active players count is now shown on the game boards instead
        }

        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }

        function endGame(victory) {
            gameActive = false;
            stopRoomPolling();
            const gameOver = document.getElementById('gameOver');
            const title = document.getElementById('gameOverTitle');
            const text = document.getElementById('gameOverText');
            
            if (victory) {
                title.textContent = '🎉 VICTORY! 🎉';
                text.textContent = 'You and your team defeated the boss!';
                gameState.player.lives = DEFAULT_LIVES;
                updateLives();
                savePlayerState({ lives: DEFAULT_LIVES });
                // show victory animation and message
                showVictoryAnimation();
            } else {
                title.textContent = '💀 GAME OVER 💀';
                text.textContent = 'The boss was too powerful...';
            }
            
            gameOver.style.display = 'block';
            
            if (ws) {
                ws.close();
            }

            function showVictoryAnimation() {
                // simple celebratory message + confetti dots
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.top = 0;
                confetti.style.left = 0;
                confetti.style.width = '100%';
                confetti.style.height = '100%';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = 2000;
                document.body.appendChild(confetti);

                for (let i = 0; i < 120; i++) {
                    const d = document.createElement('div');
                    d.style.position = 'absolute';
                    d.style.width = d.style.height = Math.random() * 10 + 6 + 'px';
                    d.style.left = Math.random() * 100 + '%';
                    d.style.top = -10 + 'px';
                    d.style.background = ['#ffd93d','#f39c12','#4facfe','#2ecc71','#e74c3c'][Math.floor(Math.random()*5)];
                    d.style.opacity = 0.95;
                    d.style.transform = 'translateY(0) rotate(' + (Math.random()*360) + 'deg)';
                    d.style.transition = 'transform 2.5s linear, top 2.5s linear, opacity 2.5s linear';
                    confetti.appendChild(d);
                    setTimeout(function () { d.style.top = (window.innerHeight + 50) + 'px'; d.style.transform = 'translateY(0) rotate(' + (Math.random()*720) + 'deg)'; d.style.opacity = 0.9; }, 10 + i*10);
                }

                setTimeout(function () { confetti.style.opacity = 0; setTimeout(function () { document.body.removeChild(confetti); }, 1000); }, 3000);
            }
        }

        function leaveBattle() {
            if (confirm('Are you sure you want to leave the battle?')) {
                stopRoomPolling();
                if (roomId) {
                    fetch(`${BOSS_API_ROOT}/boss/leave`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ room_id: roomId })
                    }).catch(function () {});
                }
                returnToBoard();
            }
        }

        function returnToBoard() {
                stopRoomPolling();
                roomId = null;
                // Return users to section 2 board (boss battle follows section 2)
                window.location.href = 'game-board-part2.html';
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 200;
        });
    </script>
</body>
</html>
