<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Battle - Multiplayer Arena</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            color: white;
        }

        .game-wrapper {
            display: flex;
            height: 100vh;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #gameCanvas {
            display: block;
            background: radial-gradient(circle, #0f3460 0%, #1a1a2e 100%);
            border: 3px solid #e94560;
        }

        /* HUD Styles */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 320px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(233, 69, 96, 0.9);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            min-width: 150px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .health-bar {
            width: 300px;
            height: 30px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            transition: width 0.3s ease;
        }

        /* Right Sidebar - Players & Chat */
        .sidebar {
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            border-left: 2px solid #e94560;
        }

        .sidebar-section {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Players List */
        .players-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .player-icon {
            font-size: 1.5em;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: bold;
            font-size: 0.9em;
        }

        .player-stats {
            font-size: 0.75em;
            opacity: 0.7;
        }

        /* Chat Section */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-message {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85em;
        }

        .chat-message .sender {
            font-weight: bold;
            color: #4facfe;
            margin-right: 5px;
        }

        .chat-message .sender-icon {
            margin-right: 3px;
        }

        .chat-message.system {
            background: rgba(233, 69, 96, 0.2);
            font-style: italic;
            text-align: center;
        }

        .chat-input-wrapper {
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.9em;
        }

        .chat-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .chat-send-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-send-btn:hover {
            background: #ff6b6b;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .btn {
            padding: 15px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .game-over h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .message-box {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(233, 69, 96, 0.95);
            padding: 15px 30px;
            border-radius: 10px;
            display: none;
            z-index: 50;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .message-box.show {
            display: block;
            animation: bounce 0.5s ease;
        }

        /* Room info badge */
        .room-badge {
            position: absolute;
            top: 20px;
            right: 320px;
            background: rgba(79, 172, 254, 0.9);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar,
        .players-list::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track,
        .players-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }

        .chat-messages::-webkit-scrollbar-thumb,
        .players-list::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-area">
            <div class="hud">
                <div class="stat-box">
                    <div class="stat-label">Boss Health</div>
                    <div class="health-bar">
                        <div class="health-fill" id="bossHealth" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Your Lives</div>
                    <div class="stat-value" id="playerLives">3</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Bullets</div>
                    <div class="stat-value" id="bulletsCount">50</div>
                </div>
            </div>

            <div class="room-badge" id="roomBadge" style="display: none;">
                Room: <span id="roomCode">---</span> | Players: <span id="playerCount">0</span>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div class="controls">
                <div style="margin-bottom: 15px; font-size: 1.2em;">
                    WASD/Arrows to move | Aim with mouse | SPACE or Click to shoot
                </div>
                <button class="btn" onclick="startBattle()" id="startBtn">Start Battle</button>
                <button class="btn" onclick="leaveBattle()">Leave Arena</button>
            </div>

            <div class="message-box" id="messageBox"></div>

            <div class="game-over" id="gameOver">
                <h1 id="gameOverTitle">Victory!</h1>
                <p id="gameOverText" style="font-size: 1.5em; margin-bottom: 30px;"></p>
                <button class="btn" onclick="returnToBoard()">Return to Board</button>
            </div>
        </div>

        <!-- Sidebar: Players & Chat -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Players in Room</div>
                <div class="players-list" id="playersList">
                    <div class="player-item" style="opacity: 0.5;">
                        <span>Waiting for players...</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-section chat-section">
                <div class="sidebar-title">Battle Chat</div>
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-message system">
                        Welcome to the Boss Battle Arena! Team up to defeat the dragon!
                    </div>
                </div>
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." maxlength="280">
                    <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const IS_LOCAL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        // Flask runs on port 8306, Socket.IO on port 8500
        const GAME_API_BASE = IS_LOCAL ? 'http://localhost:8306' : 'https://snakes.opencodingsociety.com';
        const SOCKET_URL = IS_LOCAL ? 'http://localhost:8500' : 'https://snakes.opencodingsociety.com';
        const GAME_API_ROOT = GAME_API_BASE + '/api';

        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth - 300; // Account for sidebar
            canvas.height = window.innerHeight - 200;
        }
        resizeCanvas();

        let gameActive = false;
        let roomId = null;
        let socket = null;
        let roomPollInterval = null;
        let positionBroadcastInterval = null;
        const DEFAULT_LIVES = 3;

        const CHARACTER_CONFIG = {
            knight: { icon: '🛡️', color: '#4facfe', glow: '#4facfe', name: 'Knight' },
            wizard: { icon: '🧙', color: '#8e44ad', glow: '#9b59b6', name: 'Wizard' },
            archer: { icon: '🏹', color: '#2ecc71', glow: '#27ae60', name: 'Archer' },
            warrior: { icon: '⚔️', color: '#f39c12', glow: '#f1c40f', name: 'Warrior' }
        };

        const gameState = {
            player: {
                x: canvas.width / 2,
                y: canvas.height - 100,
                size: 35,
                speed: 6,
                lives: 3,
                bullets: 50,
                character: 'knight',
                color: '#4facfe',
                username: 'Player'
            },
            boss: {
                x: canvas.width / 2,
                y: 100,
                size: 90,
                health: 1000,
                maxHealth: 1000,
                angle: 0,
                moveDirection: 1,
                moveSpeed: 2,
                verticalDirection: 1,
                verticalSpeed: 0.5,
                // Unpredictable movement properties
                baseSpeed: 2,
                targetX: null,
                targetY: null,
                dashCooldown: 0,
                patternTimer: 0,
                currentPattern: 'normal', // 'normal', 'dash', 'zigzag', 'chase', 'circle'
                circleAngle: 0,
                erraticTimer: 0
            },
            playerBullets: [],
            bossProjectiles: [],
            keys: {},
            otherPlayers: {},  // { odfsid: {x, y, character, username, lives, bullets} }
            chatMessages: [],
            // Mouse aiming
            mouseX: 0,
            mouseY: 0,
            aimAngle: -Math.PI / 2 // Default aim up
        };

        // Check if in demo mode (from sessionStorage)
        function isDemoMode() {
            try {
                return sessionStorage.getItem('snakes_demo_mode') === '1';
            } catch (e) {
                return false;
            }
        }

        // Load demo progress from sessionStorage
        function loadDemoProgress() {
            try {
                const stored = sessionStorage.getItem('snakes_demo_progress');
                if (stored) {
                    return JSON.parse(stored);
                }
            } catch (e) {
                console.error('Error loading demo progress:', e);
            }
            return null;
        }

        // Load player data from server (or sessionStorage if in demo mode)
        function loadPlayerData() {
            // Check for demo mode first
            if (isDemoMode()) {
                const demoData = loadDemoProgress();
                if (demoData) {
                    console.log('Loading player data from demo mode:', demoData);

                    if (demoData.character) {
                        gameState.player.character = demoData.character;
                        const charConfig = CHARACTER_CONFIG[demoData.character];
                        if (charConfig) {
                            gameState.player.color = charConfig.color;
                        }
                    }

                    if (typeof demoData.bullets !== 'undefined') {
                        gameState.player.bullets = Number(demoData.bullets || 0);
                        updateBulletsDisplay();
                    }
                    if (typeof demoData.lives !== 'undefined') {
                        gameState.player.lives = Number(demoData.lives || 3);
                        updateLives();
                    }

                    updatePlayersList();
                    return Promise.resolve();
                }
            }

            // Not in demo mode, fetch from server
            return fetch(GAME_API_ROOT + '/snakes/', { credentials: 'include' })
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (!data) return;
                    console.log('Loaded player data:', data);

                    if (data.selected_character) {
                        gameState.player.character = data.selected_character;
                        const charConfig = CHARACTER_CONFIG[data.selected_character];
                        if (charConfig) {
                            gameState.player.color = charConfig.color;
                        }
                    }

                    if (typeof data.total_bullets !== 'undefined') {
                        gameState.player.bullets = Number(data.total_bullets || 0);
                        updateBulletsDisplay();
                    }
                    if (typeof data.lives !== 'undefined') {
                        gameState.player.lives = Number(data.lives || 3);
                        updateLives();
                    }
                })
                .catch(err => console.error('Could not load player progress', err));
        }

        // Get username
        function loadUserInfo() {
            return fetch(GAME_API_ROOT.replace('/api', '') + '/api/id', { credentials: 'include' })
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.name) {
                        gameState.player.username = data.name;
                    }
                })
                .catch(err => console.error('Could not load user info', err));
        }

        // Initialize
        loadPlayerData();
        loadUserInfo();

        // Key handlers
        window.addEventListener('keydown', (e) => gameState.keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => gameState.keys[e.key.toLowerCase()] = false);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameActive) {
                e.preventDefault();
                shoot();
            }
        });

        // Mouse aiming - track mouse position on canvas
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            gameState.mouseX = e.clientX - rect.left;
            gameState.mouseY = e.clientY - rect.top;

            // Calculate aim angle from player to mouse
            const dx = gameState.mouseX - gameState.player.x;
            const dy = gameState.mouseY - gameState.player.y;
            gameState.aimAngle = Math.atan2(dy, dx);
        });

        // Click to shoot in aimed direction
        canvas.addEventListener('click', (e) => {
            if (gameActive) {
                e.preventDefault();
                shoot();
            }
        });

        // Prevent context menu on right-click
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Tab visibility change detection - notify room when user leaves/returns
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameActive && socket && socket.connected && roomId) {
                // User switched away from tab - notify other players
                socket.emit('boss_player_away', {
                    room_id: roomId,
                    username: gameState.player.username
                });
                addSystemMessage('You switched tabs - other players have been notified');
            } else if (!document.hidden && gameActive && socket && socket.connected && roomId) {
                // User returned to tab
                socket.emit('boss_player_returned', {
                    room_id: roomId,
                    username: gameState.player.username
                });
            }
        });

        // Handle page unload/close - ensure proper cleanup
        window.addEventListener('beforeunload', () => {
            if (gameActive && socket && socket.connected && roomId) {
                // Emit leave room event before page closes
                socket.emit('boss_leave_room', { room_id: roomId });
            }
        });

        // Handle page hide (mobile tab switching, etc.)
        window.addEventListener('pagehide', () => {
            if (gameActive && socket && socket.connected && roomId) {
                socket.emit('boss_leave_room', { room_id: roomId });
            }
        });

        // Chat input enter key
        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // Connect to Socket.IO
        function connectSocket() {
            if (socket) return;

            socket = io(SOCKET_URL, {
                transports: ['polling', 'websocket'],
                upgrade: true,
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000
            });

            socket.on('connect', () => {
                console.log('Socket connected:', socket.id);
                addSystemMessage('Connected to server!');
            });

            socket.on('disconnect', () => {
                console.log('Socket disconnected');
                addSystemMessage('Disconnected from server');
            });

            socket.on('connect_error', (error) => {
                console.error('Socket connection error:', error);
                addSystemMessage('Connection error - retrying...');
            });

            // Room state when joining
            socket.on('boss_room_state', (data) => {
                console.log('Room state received:', data);
                if (data.bossHealth !== undefined) {
                    gameState.boss.health = data.bossHealth;
                    gameState.boss.maxHealth = data.maxBossHealth || 1000;
                    updateBossHealthBar();
                }
                if (data.players) {
                    // Clear any stale player data from REST API (keyed differently)
                    gameState.otherPlayers = {};
                    // Add players with their socket sid as key
                    data.players.forEach(p => {
                        if (p.sid && p.sid !== socket.id) {
                            gameState.otherPlayers[p.sid] = p;
                        }
                    });
                    updatePlayersList();
                    document.getElementById('playerCount').textContent = data.playerCount || Object.keys(gameState.otherPlayers).length + 1;
                }
            });

            // Player joined
            socket.on('boss_player_joined', (data) => {
                console.log('Player joined:', data);
                if (data.player && data.player.sid !== socket.id) {
                    gameState.otherPlayers[data.player.sid] = data.player;
                    updatePlayersList();
                    addSystemMessage(`${data.player.username} joined the battle!`);
                }
                document.getElementById('playerCount').textContent = data.playerCount || Object.keys(gameState.otherPlayers).length + 1;
            });

            // Player left
            socket.on('boss_player_left', (data) => {
                console.log('Player left:', data);
                if (data.player) {
                    delete gameState.otherPlayers[data.player.sid];
                    updatePlayersList();
                    addSystemMessage(`${data.player.username} left the battle`);
                }
                document.getElementById('playerCount').textContent = data.playerCount || Object.keys(gameState.otherPlayers).length + 1;
            });

            // Player position update
            socket.on('boss_player_position', (data) => {
                if (gameState.otherPlayers[data.sid]) {
                    gameState.otherPlayers[data.sid].x = data.x;
                    gameState.otherPlayers[data.sid].y = data.y;
                }
            });

            // Boss health update
            socket.on('boss_health_update', (data) => {
                console.log('Boss health update:', data);
                gameState.boss.health = data.bossHealth;
                gameState.boss.maxHealth = data.maxBossHealth || 1000;
                updateBossHealthBar();
                if (data.attacker && data.attacker !== gameState.player.username) {
                    addSystemMessage(`${data.attacker} dealt ${data.damage} damage!`);
                }
            });

            // Room full notification
            socket.on('boss_room_full', (data) => {
                console.log('Room full:', data);
                addSystemMessage('Room is full (max 7 players). Try again later.');
                showMessage('Room is full!');
            });

            // Boss defeated
            socket.on('boss_defeated', (data) => {
                addSystemMessage('The boss has been defeated!');
                endGame(true);
            });

            // Player stats update
            socket.on('boss_player_stats_update', (data) => {
                if (data.player && gameState.otherPlayers[data.player.sid]) {
                    Object.assign(gameState.otherPlayers[data.player.sid], data.player);
                    updatePlayersList();
                }
            });

            // Player damaged/died
            socket.on('boss_player_damaged', (data) => {
                if (data.player && gameState.otherPlayers[data.player.sid]) {
                    gameState.otherPlayers[data.player.sid].lives = data.lives;
                    updatePlayersList();
                }
            });

            socket.on('boss_player_died', (data) => {
                addSystemMessage(data.message);
                if (data.player && gameState.otherPlayers[data.player.sid]) {
                    gameState.otherPlayers[data.player.sid].lives = 0;
                    updatePlayersList();
                }
            });

            // Chat message
            socket.on('boss_chat_message', (data) => {
                addChatMessage(data);
            });

            // Player away (switched tabs)
            socket.on('boss_player_away', (data) => {
                addSystemMessage(`${data.username} switched away from the game`);
                // Update player status in list if tracking
                if (data.sid && gameState.otherPlayers[data.sid]) {
                    gameState.otherPlayers[data.sid].isAway = true;
                    updatePlayersList();
                }
            });

            // Player returned
            socket.on('boss_player_returned', (data) => {
                addSystemMessage(`${data.username} is back!`);
                if (data.sid && gameState.otherPlayers[data.sid]) {
                    gameState.otherPlayers[data.sid].isAway = false;
                    updatePlayersList();
                }
            });
        }

        async function startBattle() {
            try {
                // Join room via REST API
                const response = await fetch(`${GAME_API_ROOT}/boss/join`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bullets: gameState.player.bullets,
                        lives: gameState.player.lives,
                        character: gameState.player.character,
                        dev_mode: true  // Skip square 25 requirement for testing
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    roomId = data.room_id;
                    console.log('Joined room:', data);

                    // Update room badge
                    document.getElementById('roomBadge').style.display = 'block';
                    document.getElementById('roomCode').textContent = data.room_id.substring(0, 8);
                    document.getElementById('playerCount').textContent = data.room.player_count || data.room.total_players || 1;

                    // Sync boss state
                    if (data.room) {
                        gameState.boss.health = data.room.boss_health;
                        gameState.boss.maxHealth = data.room.max_boss_health;
                        updateBossHealthBar();
                    }

                    // Note: Players will be populated via socket 'boss_room_state' event
                    // which provides proper socket session IDs for position syncing
                    console.log('Players in room from REST API:', data.players?.length || 0);

                    // Connect socket and join room
                    connectSocket();
                    setTimeout(() => {
                        if (socket && socket.connected) {
                            socket.emit('boss_join_room', {
                                room_id: roomId,
                                boss_health: gameState.boss.health,
                                max_boss_health: gameState.boss.maxHealth,
                                player: {
                                    user_id: data.player?.user_id,
                                    username: data.player?.username || gameState.player.username,
                                    character: gameState.player.character,
                                    x: gameState.player.x,
                                    y: gameState.player.y,
                                    bullets: gameState.player.bullets,
                                    lives: gameState.player.lives
                                }
                            });
                        }
                    }, 500);

                    // Start position broadcasting
                    startPositionBroadcast();

                    gameActive = true;
                    document.getElementById('startBtn').disabled = true;
                    addSystemMessage('Battle started! Work together to defeat the boss!');
                    gameLoop();
                }
            } catch (error) {
                console.error('Join battle error:', error);
                // Fallback to single player mode
                gameActive = true;
                document.getElementById('startBtn').disabled = true;
                addSystemMessage('Playing in offline mode');
                gameLoop();
            }
        }

        function startPositionBroadcast() {
            if (positionBroadcastInterval) clearInterval(positionBroadcastInterval);
            positionBroadcastInterval = setInterval(() => {
                if (socket && socket.connected && roomId) {
                    socket.emit('boss_player_move', {
                        room_id: roomId,
                        x: gameState.player.x,
                        y: gameState.player.y
                    });
                }
            }, 50); // 20 FPS position updates
        }

        function stopPositionBroadcast() {
            if (positionBroadcastInterval) {
                clearInterval(positionBroadcastInterval);
                positionBroadcastInterval = null;
            }
        }

        function savePlayerState(overrides) {
            const bullets = Math.max(0, Math.floor(gameState.player.bullets));
            const lives = Math.max(0, Math.floor(gameState.player.lives));

            // If in demo mode, save to sessionStorage instead of server
            if (isDemoMode()) {
                try {
                    const stored = sessionStorage.getItem('snakes_demo_progress');
                    let demoData = stored ? JSON.parse(stored) : {};
                    demoData.bullets = overrides?.total_bullets ?? bullets;
                    demoData.lives = overrides?.lives ?? lives;
                    sessionStorage.setItem('snakes_demo_progress', JSON.stringify(demoData));
                    console.log('Demo mode: saved player state to session', demoData);
                } catch (e) {
                    console.error('Error saving demo state:', e);
                }
                return Promise.resolve();
            }

            const payload = Object.assign({
                total_bullets: bullets,
                lives: lives
            }, overrides || {});

            return fetch(`${GAME_API_ROOT}/snakes/`, {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error('Failed to save player state', err));
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            movePlayer();
            moveBoss();
            moveBullets();
            moveBossProjectiles();
            spawnBossProjectiles();
            drawGame();
            checkCollisions();

            requestAnimationFrame(gameLoop);
        }

        function movePlayer() {
            if (gameState.keys['a'] || gameState.keys['arrowleft']) {
                gameState.player.x = Math.max(gameState.player.size, gameState.player.x - gameState.player.speed);
            }
            if (gameState.keys['d'] || gameState.keys['arrowright']) {
                gameState.player.x = Math.min(canvas.width - gameState.player.size, gameState.player.x + gameState.player.speed);
            }
            if (gameState.keys['w'] || gameState.keys['arrowup']) {
                gameState.player.y = Math.max(gameState.player.size + 200, gameState.player.y - gameState.player.speed);
            }
            if (gameState.keys['s'] || gameState.keys['arrowdown']) {
                gameState.player.y = Math.min(canvas.height - gameState.player.size, gameState.player.y + gameState.player.speed);
            }
        }

        function shoot() {
            if (gameState.player.bullets > 0) {
                // Calculate bullet direction based on aim angle
                const bulletSpeed = 10;
                const dx = Math.cos(gameState.aimAngle) * bulletSpeed;
                const dy = Math.sin(gameState.aimAngle) * bulletSpeed;

                // Spawn bullet slightly ahead of player in the aim direction
                const spawnOffset = gameState.player.size + 5;
                const spawnX = gameState.player.x + Math.cos(gameState.aimAngle) * spawnOffset;
                const spawnY = gameState.player.y + Math.sin(gameState.aimAngle) * spawnOffset;

                gameState.playerBullets.push({
                    x: spawnX,
                    y: spawnY,
                    size: 8,
                    speed: bulletSpeed,
                    dx: dx,
                    dy: dy
                });
                gameState.player.bullets--;
                updateBulletsDisplay();
                savePlayerState();

                // Broadcast stats
                if (socket && socket.connected && roomId) {
                    socket.emit('boss_player_stats', {
                        room_id: roomId,
                        bullets: gameState.player.bullets
                    });
                }
            }
        }

        function moveBullets() {
            gameState.playerBullets = gameState.playerBullets.filter(bullet => {
                // Use directional movement if available, otherwise move upward
                if (bullet.dx !== undefined && bullet.dy !== undefined) {
                    bullet.x += bullet.dx;
                    bullet.y += bullet.dy;
                } else {
                    bullet.y -= bullet.speed;
                }
                // Remove bullets that go off-screen (any edge)
                return bullet.y > 0 && bullet.y < canvas.height &&
                       bullet.x > 0 && bullet.x < canvas.width;
            });
        }

        function moveBossProjectiles() {
            gameState.bossProjectiles = gameState.bossProjectiles.filter(proj => {
                proj.y += proj.speed;
                proj.x += proj.dx;
                return proj.y < canvas.height;
            });
        }

        function spawnBossProjectiles() {
            if (Math.random() < 0.06) {
                const angle = Math.random() * Math.PI / 2 + Math.PI / 4;
                gameState.bossProjectiles.push({
                    x: gameState.boss.x,
                    y: gameState.boss.y + gameState.boss.size,
                    size: 12,
                    speed: 5,
                    dx: Math.cos(angle) * 2.5 - 1.25
                });
            }
            if (Math.random() < 0.01) {
                for (let i = 0; i < 3; i++) {
                    const burstAngle = (Math.PI / 4) + (i * Math.PI / 4);
                    gameState.bossProjectiles.push({
                        x: gameState.boss.x,
                        y: gameState.boss.y + gameState.boss.size,
                        size: 10,
                        speed: 4,
                        dx: Math.cos(burstAngle) * 2 - 1
                    });
                }
            }
        }

        function moveBoss() {
            const boss = gameState.boss;
            const margin = 80;
            const minY = 60;
            const maxY = 220;

            // Update timers
            boss.patternTimer++;
            boss.erraticTimer++;
            if (boss.dashCooldown > 0) boss.dashCooldown--;

            // Randomly switch movement patterns every 120-300 frames
            if (boss.patternTimer > 120 + Math.random() * 180) {
                boss.patternTimer = 0;
                const patterns = ['normal', 'dash', 'zigzag', 'chase', 'circle', 'erratic'];
                boss.currentPattern = patterns[Math.floor(Math.random() * patterns.length)];
                boss.moveSpeed = boss.baseSpeed + Math.random() * 2; // Vary speed
            }

            // Random direction changes (5% chance per frame)
            if (Math.random() < 0.05) {
                boss.moveDirection *= -1;
            }
            if (Math.random() < 0.03) {
                boss.verticalDirection *= -1;
            }

            // Execute current movement pattern
            switch (boss.currentPattern) {
                case 'dash':
                    // Quick dash to random position
                    if (!boss.targetX || Math.abs(boss.x - boss.targetX) < 20) {
                        boss.targetX = margin + Math.random() * (canvas.width - margin * 2);
                        boss.targetY = minY + Math.random() * (maxY - minY);
                    }
                    const dashSpeed = 6;
                    boss.x += (boss.targetX - boss.x) > 0 ? dashSpeed : -dashSpeed;
                    boss.y += (boss.targetY - boss.y) > 0 ? dashSpeed * 0.5 : -dashSpeed * 0.5;
                    break;

                case 'zigzag':
                    // Fast zigzag movement
                    boss.x += boss.moveSpeed * 1.5 * boss.moveDirection;
                    boss.y += Math.sin(boss.patternTimer * 0.2) * 4;
                    if (boss.patternTimer % 30 === 0) boss.moveDirection *= -1;
                    break;

                case 'chase':
                    // Chase the nearest player
                    let targetPlayerX = gameState.player.x;
                    let targetPlayerY = gameState.player.y;
                    const chaseSpeed = 2.5;

                    // Move towards player but stay in upper area
                    if (boss.x < targetPlayerX - 20) boss.x += chaseSpeed;
                    else if (boss.x > targetPlayerX + 20) boss.x -= chaseSpeed;

                    // Slight vertical movement when chasing
                    boss.y += Math.sin(boss.patternTimer * 0.1) * 1.5;
                    break;

                case 'circle':
                    // Circular movement pattern
                    boss.circleAngle += 0.03;
                    const circleRadius = 150;
                    const centerX = canvas.width / 2;
                    const centerY = 140;
                    boss.x = centerX + Math.cos(boss.circleAngle) * circleRadius;
                    boss.y = centerY + Math.sin(boss.circleAngle) * (circleRadius * 0.4);
                    break;

                case 'erratic':
                    // Completely random, jerky movement
                    if (boss.erraticTimer % 10 === 0) {
                        boss.x += (Math.random() - 0.5) * 40;
                        boss.y += (Math.random() - 0.5) * 20;
                    }
                    boss.x += boss.moveSpeed * boss.moveDirection * 0.5;
                    break;

                default: // 'normal'
                    // Standard movement with slight variations
                    boss.x += boss.moveSpeed * boss.moveDirection;
                    boss.y += boss.verticalSpeed * boss.verticalDirection;

                    // Add slight wobble
                    boss.x += Math.sin(boss.patternTimer * 0.1) * 0.5;
            }

            // Keep boss within bounds
            if (boss.x >= canvas.width - margin) {
                boss.x = canvas.width - margin;
                boss.moveDirection = -1;
            } else if (boss.x <= margin) {
                boss.x = margin;
                boss.moveDirection = 1;
            }

            if (boss.y >= maxY) {
                boss.y = maxY;
                boss.verticalDirection = -1;
            } else if (boss.y <= minY) {
                boss.y = minY;
                boss.verticalDirection = 1;
            }

            // Random speed bursts (3% chance)
            if (Math.random() < 0.03) {
                boss.moveSpeed = boss.baseSpeed + Math.random() * 3;
            }
        }

        function checkCollisions() {
            // Player bullets hitting boss
            gameState.playerBullets = gameState.playerBullets.filter(bullet => {
                const distance = Math.hypot(bullet.x - gameState.boss.x, bullet.y - gameState.boss.y);
                if (distance < gameState.boss.size) {
                    const damage = 10;
                    gameState.boss.health = Math.max(0, gameState.boss.health - damage);
                    updateBossHealthBar();

                    // Broadcast damage
                    if (socket && socket.connected && roomId) {
                        socket.emit('boss_damage', {
                            room_id: roomId,
                            damage: damage
                        });
                    }

                    if (gameState.boss.health <= 0) {
                        endGame(true);
                    }
                    return false;
                }
                return true;
            });

            // Boss projectiles hitting player
            gameState.bossProjectiles.forEach(proj => {
                const distance = Math.hypot(proj.x - gameState.player.x, proj.y - gameState.player.y);
                if (distance < gameState.player.size + proj.size) {
                    gameState.player.lives--;
                    updateLives();
                    savePlayerState();
                    proj.y = canvas.height + 100;

                    // Broadcast hit
                    if (socket && socket.connected && roomId) {
                        socket.emit('boss_player_hit', {
                            room_id: roomId,
                            lives: gameState.player.lives
                        });
                    }

                    if (gameState.player.lives <= 0) {
                        endGame(false);
                    }
                }
            });
        }

        function drawGame() {
            // Draw boss
            gameState.boss.angle += 0.01;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#e94560';
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(gameState.boss.x, gameState.boss.y, gameState.boss.size, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(gameState.boss.x, gameState.boss.y);
            ctx.rotate(gameState.boss.angle);
            ctx.font = '60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐲', 0, 0);
            ctx.restore();

            // Draw other players
            Object.values(gameState.otherPlayers).forEach(player => {
                if (!player.x || !player.y) return;

                const charConfig = CHARACTER_CONFIG[player.character] || CHARACTER_CONFIG.knight;

                // Glow circle
                ctx.shadowBlur = 20;
                ctx.shadowColor = charConfig.glow;
                ctx.fillStyle = charConfig.color;
                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                ctx.arc(player.x, player.y, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // Character icon
                ctx.shadowBlur = 10;
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(charConfig.icon, player.x, player.y);

                // Player name
                ctx.shadowBlur = 0;
                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(player.username || 'Player', player.x, player.y - 45);
            });

            // Draw current player
            const charConfig = CHARACTER_CONFIG[gameState.player.character] || CHARACTER_CONFIG.knight;
            ctx.shadowBlur = 25;
            ctx.shadowColor = charConfig.glow;
            ctx.fillStyle = charConfig.color;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.arc(gameState.player.x, gameState.player.y, gameState.player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // Draw aiming indicator (line from player to aim direction)
            if (gameActive) {
                const aimLength = 60;
                const aimEndX = gameState.player.x + Math.cos(gameState.aimAngle) * aimLength;
                const aimEndY = gameState.player.y + Math.sin(gameState.aimAngle) * aimLength;

                // Draw aim line
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(gameState.player.x, gameState.player.y);
                ctx.lineTo(aimEndX, aimEndY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw crosshair at aim point
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                ctx.lineWidth = 2;
                const crossSize = 8;
                ctx.beginPath();
                ctx.moveTo(aimEndX - crossSize, aimEndY);
                ctx.lineTo(aimEndX + crossSize, aimEndY);
                ctx.moveTo(aimEndX, aimEndY - crossSize);
                ctx.lineTo(aimEndX, aimEndY + crossSize);
                ctx.stroke();

                // Draw circle around crosshair
                ctx.beginPath();
                ctx.arc(aimEndX, aimEndY, crossSize + 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.shadowBlur = 15;
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(charConfig.icon, gameState.player.x, gameState.player.y);

            // "You" label
            ctx.shadowBlur = 0;
            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = '#4facfe';
            ctx.fillText('You', gameState.player.x, gameState.player.y - 45);

            ctx.shadowBlur = 0;

            // Draw player bullets
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#FFD700';
            ctx.fillStyle = '#FFD700';
            gameState.playerBullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw boss projectiles
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#e94560';
            ctx.fillStyle = '#e94560';
            gameState.bossProjectiles.forEach(proj => {
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
        }

        function updateBossHealthBar() {
            const percentage = (gameState.boss.health / gameState.boss.maxHealth) * 100;
            document.getElementById('bossHealth').style.width = percentage + '%';
        }

        function updateLives() {
            document.getElementById('playerLives').textContent = gameState.player.lives;
        }

        function updateBulletsDisplay() {
            document.getElementById('bulletsCount').textContent = gameState.player.bullets;
        }

        function updatePlayersList() {
            const list = document.getElementById('playersList');
            const players = Object.values(gameState.otherPlayers);

            let html = '';

            // Current player first
            const myConfig = CHARACTER_CONFIG[gameState.player.character] || CHARACTER_CONFIG.knight;
            html += `
                <div class="player-item" style="border-left: 3px solid ${myConfig.color};">
                    <span class="player-icon">${myConfig.icon}</span>
                    <div class="player-info">
                        <div class="player-name">${gameState.player.username} (You)</div>
                        <div class="player-stats">Lives: ${gameState.player.lives} | Bullets: ${gameState.player.bullets}</div>
                    </div>
                </div>
            `;

            // Other players
            players.forEach(player => {
                const config = CHARACTER_CONFIG[player.character] || CHARACTER_CONFIG.knight;
                html += `
                    <div class="player-item">
                        <span class="player-icon">${config.icon}</span>
                        <div class="player-info">
                            <div class="player-name">${player.username || 'Player'}</div>
                            <div class="player-stats">Lives: ${player.lives || 0} | Bullets: ${player.bullets || 0}</div>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function addChatMessage(data) {
            const container = document.getElementById('chatMessages');
            const config = CHARACTER_CONFIG[data.character] || CHARACTER_CONFIG.knight;
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `
                <span class="sender-icon">${config.icon}</span>
                <span class="sender">${data.username}:</span>
                ${escapeHtml(data.content)}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'chat-message system';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content) return;

            if (socket && socket.connected && roomId) {
                socket.emit('boss_chat_send', {
                    room_id: roomId,
                    content: content,
                    username: gameState.player.username,
                    character: gameState.player.character
                });
            } else {
                // Offline mode - just show locally
                addChatMessage({
                    username: gameState.player.username,
                    character: gameState.player.character,
                    content: content
                });
            }

            input.value = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            box.textContent = msg;
            box.classList.add('show');
            setTimeout(() => box.classList.remove('show'), 3000);
        }

        function endGame(victory) {
            gameActive = false;
            stopPositionBroadcast();

            const gameOver = document.getElementById('gameOver');
            const title = document.getElementById('gameOverTitle');
            const text = document.getElementById('gameOverText');

            if (victory) {
                title.textContent = 'VICTORY!';
                text.textContent = 'You and your team defeated the boss!';
                gameState.player.lives = DEFAULT_LIVES;
                updateLives();
                savePlayerState({ lives: DEFAULT_LIVES });
                showVictoryAnimation();
            } else {
                title.textContent = 'GAME OVER';
                text.textContent = 'The boss was too powerful...';
            }

            gameOver.style.display = 'block';

            if (socket && roomId) {
                socket.emit('boss_leave_room', { room_id: roomId });
            }
        }

        function showVictoryAnimation() {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.top = 0;
            confetti.style.left = 0;
            confetti.style.width = '100%';
            confetti.style.height = '100%';
            confetti.style.pointerEvents = 'none';
            confetti.style.zIndex = 2000;
            document.body.appendChild(confetti);

            for (let i = 0; i < 120; i++) {
                const d = document.createElement('div');
                d.style.position = 'absolute';
                d.style.width = d.style.height = Math.random() * 10 + 6 + 'px';
                d.style.left = Math.random() * 100 + '%';
                d.style.top = -10 + 'px';
                d.style.background = ['#ffd93d','#f39c12','#4facfe','#2ecc71','#e74c3c'][Math.floor(Math.random()*5)];
                d.style.opacity = 0.95;
                d.style.transform = 'translateY(0) rotate(' + (Math.random()*360) + 'deg)';
                d.style.transition = 'transform 2.5s linear, top 2.5s linear, opacity 2.5s linear';
                confetti.appendChild(d);
                setTimeout(() => { d.style.top = (window.innerHeight + 50) + 'px'; d.style.transform = 'translateY(0) rotate(' + (Math.random()*720) + 'deg)'; d.style.opacity = 0.9; }, 10 + i*10);
            }

            setTimeout(() => { confetti.style.opacity = 0; setTimeout(() => { document.body.removeChild(confetti); }, 1000); }, 3000);
        }

        function leaveBattle() {
            if (confirm('Are you sure you want to leave the battle?')) {
                stopPositionBroadcast();
                if (roomId && socket) {
                    socket.emit('boss_leave_room', { room_id: roomId });
                    fetch(`${GAME_API_ROOT}/boss/leave`, {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ room_id: roomId })
                    }).catch(() => {});
                }
                returnToBoard();
            }
        }

        function returnToBoard() {
            stopPositionBroadcast();
            roomId = null;
            window.location.href = 'game-board-part2.html';
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        // Initialize players list
        updatePlayersList();
    </script>
</body>
</html>
