<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback - Snakes and Ladders</title>
    <link rel="stylesheet" href="../../assets/css/snakes-theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .page-shell {
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 2.6em;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 1.05em;
            color: var(--muted-text);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--panel-bg, rgba(10, 14, 22, 0.78));
            border: 2px solid var(--panel-border, rgba(255, 255, 255, 0.12));
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        }

        .panel h2 {
            font-size: 1.3em;
            margin-bottom: 12px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-field label {
            font-size: 0.9em;
            color: var(--muted-text);
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(12, 16, 26, 0.75);
            color: #ffffff;
            font-size: 0.95em;
        }

        .form-field textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn.primary {
            background: var(--button-bg);
            color: var(--button-text);
            box-shadow: 0 12px 24px rgba(var(--accent-rgb), 0.24);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .meta-note {
            font-size: 0.85em;
            color: var(--muted-text);
            margin-top: 10px;
            line-height: 1.4;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .tab-btn {
            border-radius: 999px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9em;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.45), rgba(var(--accent-2-rgb), 0.35));
            border-color: rgba(var(--accent-rgb), 0.6);
        }

        .feedback-list {
            display: grid;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .feedback-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 14px;
        }

        .feedback-card h3 {
            font-size: 1em;
            margin-bottom: 6px;
            color: var(--heading);
        }

        .feedback-card p {
            font-size: 0.95em;
            line-height: 1.5;
            color: var(--muted-text);
        }

        .feedback-card .meta {
            margin-top: 8px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state {
            text-align: center;
            color: var(--muted-text);
            padding: 30px 0;
        }

        .top-actions {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        @media (max-width: 820px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="snakes-theme">
    <div class="page-shell">
        <header class="page-header">
            <h1 class="page-title">Player Feedback</h1>
            <p class="page-subtitle">Share your ideas and browse community inspiration.</p>
        </header>

        <section class="layout-grid">
            <div class="panel">
                <h2>Leave Your Feedback</h2>
                <form id="feedbackForm">
                    <div class="form-field">
                        <label for="displayName">Display name (optional)</label>
                        <input id="displayName" type="text" maxlength="40" placeholder="Champion Name">
                    </div>
                    <div class="form-field">
                        <label for="feedbackText">Your feedback</label>
                        <textarea id="feedbackText" maxlength="600" placeholder="What did you love? What should we improve?"></textarea>
                    </div>
                    <div class="form-actions">
                        <button class="btn primary" type="submit">Save Feedback</button>
                        <button class="btn secondary" type="button" id="clearFormBtn">Clear</button>
                    </div>
                </form>
                <p class="meta-note" id="storageNote">
                    Feedback is saved to the local database (localStorage) on this device.
                </p>
            </div>

            <div class="panel">
                <h2>Community Feedback</h2>
                <div class="tabs">
                    <button class="tab-btn active" data-filter="all" type="button">All Feedback</button>
                    <button class="tab-btn" data-filter="mine" type="button">My Feedback</button>
                </div>
                <div class="feedback-list" id="feedbackList"></div>
            </div>
        </section>

        <div class="top-actions">
            <button class="btn secondary" type="button" onclick="goToVictory()">Back to Victory</button>
        </div>
    </div>

    <script src="../../assets/js/theme-selector.js"></script>
    <script type="module">
        import { pythonURI } from '../../assets/js/api/config.js';

        const STORAGE_KEY = 'snakes_feedback_entries';
        const DB_KEY = 'snakes_local_db_v1';
        const USER_KEY = 'snakes_feedback_local_user';
        const HIDDEN_KEY = 'snakes_feedback_hidden';
        const FEEDBACK_API = `${pythonURI}/api/feedback`;

        const form = document.getElementById('feedbackForm');
        const displayNameInput = document.getElementById('displayName');
        const feedbackInput = document.getElementById('feedbackText');
        const feedbackList = document.getElementById('feedbackList');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const storageNote = document.getElementById('storageNote');

        let currentFilter = 'all';
        let currentUser = null;
        let localUserId = localStorage.getItem(USER_KEY);
        if (!localUserId) {
            localUserId = 'user-' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem(USER_KEY, localUserId);
        }

        function loadDb() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        accounts: Array.isArray(parsed.accounts) ? parsed.accounts : [],
                        feedback: Array.isArray(parsed.feedback) ? parsed.feedback : []
                    };
                }
            } catch (e) {}
            return { accounts: [], feedback: [] };
        }

        function saveDb(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function loadHiddenIds() {
            try {
                const raw = localStorage.getItem(HIDDEN_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveHiddenIds(ids) {
            localStorage.setItem(HIDDEN_KEY, JSON.stringify(ids));
        }

        function hideEntry(id) {
            const ids = loadHiddenIds();
            if (!ids.includes(id)) {
                ids.push(id);
                saveHiddenIds(ids);
            }
        }

        function migrateLegacyFeedbackIfNeeded() {
            try {
                const legacyRaw = localStorage.getItem(STORAGE_KEY);
                if (!legacyRaw) return;
                const legacyEntries = JSON.parse(legacyRaw);
                if (!Array.isArray(legacyEntries) || !legacyEntries.length) return;
                const db = loadDb();
                if (!db.feedback.length) {
                    db.feedback = legacyEntries;
                    saveDb(db);
                }
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}
        }

        function loadEntries() {
            return loadDb().feedback;
        }

        function saveEntries(entries) {
            const db = loadDb();
            db.feedback = entries;
            saveDb(db);
        }

        async function fetchCurrentUser() {
            try {
                const res = await fetch(`${pythonURI}/api/id`, { credentials: 'include' });
                if (!res.ok) return null;
                const data = await res.json();
                return data;
            } catch (e) {
                return null;
            }
        }

        function normalizeApiEntry(entry) {
            return {
                id: entry.id || 'fb-' + Date.now(),
                displayName: entry.github_username || 'Anonymous Champion',
                text: entry.body || '',
                localUserId: entry.github_username || '',
                createdAt: entry.created_at || new Date().toISOString(),
                type: entry.type || 'Other',
                githubIssueUrl: entry.github_issue_url || null
            };
        }

        async function loadEntriesFromApi() {
            try {
                const res = await fetch(`${FEEDBACK_API}/all`, { credentials: 'include' });
                if (!res.ok) throw new Error('Failed to fetch feedback');
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('Invalid feedback response');
                return data.map(normalizeApiEntry);
            } catch (e) {
                return null;
            }
        }

        async function createEntryViaApi(entry) {
            const resolvedUid = entry.displayName
                || (currentUser && (currentUser.name || currentUser.uid || currentUser.username))
                || entry.localUserId
                || 'Anonymous';
            const payload = {
                title: entry.title,
                body: entry.text,
                type: entry.type || 'Other',
                uid: resolvedUid
            };
            const res = await fetch(`${FEEDBACK_API}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || 'Failed to save feedback');
            }
            const saved = await res.json();
            return normalizeApiEntry(saved);
        }

        function renderEntries(entriesOverride = null) {
            const hiddenIds = loadHiddenIds();
            const entries = (entriesOverride || loadEntries())
                .filter(entry => !hiddenIds.includes(entry.id));
            const filtered = currentFilter === 'mine'
                ? entries.filter(entry => entry.localUserId === localUserId)
                : entries;

            if (!filtered.length) {
                feedbackList.innerHTML = '<div class="empty-state">No feedback yet. Be the first to share!</div>';
                return;
            }

            feedbackList.innerHTML = filtered
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                .map(entry => {
                    const safeName = entry.displayName || entry.localUserId || 'Anonymous Champion';
                    const created = new Date(entry.createdAt).toLocaleString();
                    const deleteBtn = entry.localUserId === localUserId
                        ? `<button class="btn secondary delete-feedback-btn" type="button" data-id="${entry.id}">Delete</button>`
                        : '';
                    return `
                        <div class="feedback-card">
                            <h3>${safeName}</h3>
                            <p>${entry.text}</p>
                            <div class="meta">${created}</div>
                            ${deleteBtn}
                        </div>
                    `;
                })
                .join('');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = feedbackInput.value.trim();
            if (text.length < 5) {
                alert('Please add a bit more detail before saving.');
                return;
            }

            const displayName = displayNameInput.value.trim();
            const resolvedLocalId = displayName
                || (currentUser && (currentUser.name || currentUser.uid || currentUser.username))
                || localUserId;

            const entry = {
                id: 'fb-' + Date.now(),
                displayName,
                text,
                localUserId: resolvedLocalId,
                createdAt: new Date().toISOString(),
                title: displayName ? `${displayName} feedback` : 'Snakes feedback',
                type: 'Other'
            };

            try {
                const saved = await createEntryViaApi(entry);
                const apiEntries = await loadEntriesFromApi();
                feedbackInput.value = '';
                renderEntries(apiEntries || [saved, ...loadEntries()]);
            } catch (e) {
                const entries = loadEntries();
                entries.push(entry);
                saveEntries(entries);
                feedbackInput.value = '';
                renderEntries();
            }
        });

        clearFormBtn.addEventListener('click', () => {
            displayNameInput.value = '';
            feedbackInput.value = '';
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderEntries();
            });
        });

        feedbackList.addEventListener('click', (event) => {
            const button = event.target.closest('.delete-feedback-btn');
            if (!button) return;
            const id = button.dataset.id;
            if (!id) return;
            if (!confirm('Hide this feedback from your view?')) return;
            hideEntry(id);
            renderEntries();
        });

        function goToVictory() {
            window.location.href = 'victory.html';
        }

        async function initFeedback() {
            migrateLegacyFeedbackIfNeeded();
            currentUser = await fetchCurrentUser();
            if (currentUser && (currentUser.name || currentUser.uid || currentUser.username)) {
                localUserId = currentUser.name || currentUser.uid || currentUser.username;
            }

            const apiEntries = await loadEntriesFromApi();
            if (apiEntries) {
                renderEntries(apiEntries);
                storageNote.textContent = 'Feedback is saved to the Snakes backend and shared across accounts.';
                return;
            }

            renderEntries();
        }

        initFeedback();
    </script>
</body>
</html>
