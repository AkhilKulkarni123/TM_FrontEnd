<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback - Snakes and Ladders</title>
    <link rel="stylesheet" href="../../assets/css/snakes-theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .page-shell {
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 2.6em;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 1.05em;
            color: var(--muted-text);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: minmax(280px, 360px) 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--panel-bg, rgba(10, 14, 22, 0.78));
            border: 2px solid var(--panel-border, rgba(255, 255, 255, 0.12));
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        }

        .panel h2 {
            font-size: 1.3em;
            margin-bottom: 12px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-field label {
            font-size: 0.9em;
            color: var(--muted-text);
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(12, 16, 26, 0.75);
            color: #ffffff;
            font-size: 0.95em;
        }

        .form-field textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn.primary {
            background: var(--button-bg);
            color: var(--button-text);
            box-shadow: 0 12px 24px rgba(var(--accent-rgb), 0.24);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .meta-note {
            font-size: 0.85em;
            color: var(--muted-text);
            margin-top: 10px;
            line-height: 1.4;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .tab-btn {
            border-radius: 999px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            cursor: pointer;
            font-size: 0.9em;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.45), rgba(var(--accent-2-rgb), 0.35));
            border-color: rgba(var(--accent-rgb), 0.6);
        }

        .feedback-list {
            display: grid;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .feedback-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 14px;
        }

        .feedback-card h3 {
            font-size: 1em;
            margin-bottom: 6px;
            color: var(--heading);
        }

        .feedback-card p {
            font-size: 0.95em;
            line-height: 1.5;
            color: var(--muted-text);
        }

        .feedback-card .meta {
            margin-top: 8px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state {
            text-align: center;
            color: var(--muted-text);
            padding: 30px 0;
        }

        .top-actions {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        @media (max-width: 820px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="snakes-theme">
    <div class="page-shell">
        <header class="page-header">
            <h1 class="page-title">Player Feedback</h1>
            <p class="page-subtitle">Share your ideas and browse community inspiration.</p>
        </header>

        <section class="layout-grid">
            <div class="panel">
                <h2>Leave Your Feedback</h2>
                <form id="feedbackForm">
                    <div class="form-field">
                        <label for="displayName">Display name (optional)</label>
                        <input id="displayName" type="text" maxlength="40" placeholder="Champion Name">
                    </div>
                    <div class="form-field">
                        <label for="feedbackText">Your feedback</label>
                        <textarea id="feedbackText" maxlength="600" placeholder="What did you love? What should we improve?"></textarea>
                    </div>
                    <div class="form-actions">
                        <button class="btn primary" type="submit">Save Feedback</button>
                        <button class="btn secondary" type="button" id="clearFormBtn">Clear</button>
                    </div>
                </form>
                <p class="meta-note" id="storageNote">
                    Feedback is saved locally on this device.
                </p>
            </div>

            <div class="panel">
                <h2>Community Feedback</h2>
                <div class="tabs">
                    <button class="tab-btn active" data-filter="all" type="button">All Feedback</button>
                    <button class="tab-btn" data-filter="mine" type="button">My Feedback</button>
                </div>
                <div class="feedback-list" id="feedbackList"></div>
            </div>
        </section>

        <div class="top-actions">
            <button class="btn secondary" type="button" onclick="goToVictory()">Back to Victory</button>
        </div>
    </div>

    <script src="../../assets/js/theme-selector.js"></script>
    <script>
        const STORAGE_KEY = 'snakes_feedback_entries';
        const USER_KEY = 'snakes_feedback_local_user';

        const form = document.getElementById('feedbackForm');
        const displayNameInput = document.getElementById('displayName');
        const feedbackInput = document.getElementById('feedbackText');
        const feedbackList = document.getElementById('feedbackList');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const storageNote = document.getElementById('storageNote');

        let currentFilter = 'all';
        let localUserId = localStorage.getItem(USER_KEY);
        if (!localUserId) {
            localUserId = 'user-' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem(USER_KEY, localUserId);
        }

        function loadEntries() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveEntries(entries) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        }

        function renderEntries() {
            const entries = loadEntries();
            const filtered = currentFilter === 'mine'
                ? entries.filter(entry => entry.localUserId === localUserId)
                : entries;

            if (!filtered.length) {
                feedbackList.innerHTML = '<div class="empty-state">No feedback yet. Be the first to share!</div>';
                return;
            }

            feedbackList.innerHTML = filtered
                .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                .map(entry => {
                    const safeName = entry.displayName || 'Anonymous Champion';
                    const created = new Date(entry.createdAt).toLocaleString();
                    return `
                        <div class="feedback-card">
                            <h3>${safeName}</h3>
                            <p>${entry.text}</p>
                            <div class="meta">${created}</div>
                        </div>
                    `;
                })
                .join('');
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const text = feedbackInput.value.trim();
            if (text.length < 5) {
                alert('Please add a bit more detail before saving.');
                return;
            }

            const entries = loadEntries();
            entries.push({
                id: 'fb-' + Date.now(),
                displayName: displayNameInput.value.trim(),
                text,
                localUserId,
                createdAt: new Date().toISOString()
            });

            saveEntries(entries);
            feedbackInput.value = '';
            renderEntries();
        });

        clearFormBtn.addEventListener('click', () => {
            displayNameInput.value = '';
            feedbackInput.value = '';
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderEntries();
            });
        });

        function goToVictory() {
            window.location.href = 'victory.html';
        }

        renderEntries();
    </script>
</body>
</html>
