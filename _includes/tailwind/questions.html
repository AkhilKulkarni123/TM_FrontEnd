
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Time!</title>
    <link rel="stylesheet" href="/css/snakes-game.css">
    <style>
        body {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .question-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        h2 {
            color: #667eea;
            margin-top: 0;
            font-size: 2em;
            text-align: center;
        }
        .question-info {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .question-prompt {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 1em;
            font-family: inherit;
        }
        .option-btn:hover:not(:disabled) {
            background: #e8ebff;
            border-color: #667eea;
            transform: translateX(5px);
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            animation: pulse 0.5s ease;
        }
        .option-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            animation: shake 0.5s ease;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            animation: fadeIn 0.5s ease;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
        }
        .result.failure {
            background: #f8d7da;
            color: #721c24;
        }
        .hidden {
            display: none;
        }
        .debug-info {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            font-size: 0.85em;
            color: #666;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .error-container {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="question-container">
        <h2>Question Time! 🎯</h2>
        <div class="question-info" id="info">Loading...</div>
        <div id="question-display">
            <p class="question-prompt" id="prompt">Loading question...</p>
            <div class="options" id="options"></div>
        </div>
        <div id="result" class="result hidden"></div>
        <div id="debug" class="debug-info hidden"></div>
    </div>

    <script src="/js/questions_bank.js"></script>
    
    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const row = parseInt(urlParams.get('row'));
        const index = parseInt(urlParams.get('index'));
        const square = parseInt(urlParams.get('square'));

        const debugDiv = document.getElementById('debug');
        const infoDiv = document.getElementById('info');
        const questionDisplay = document.getElementById('question-display');
        
        function log(msg) {
            console.log(msg);
            if (debugDiv) debugDiv.textContent += msg + '\n';
        }

        function showError(message) {
            questionDisplay.innerHTML = `
                <div class="error-container">
                    <h3>⚠️ Error Loading Question</h3>
                    <p>${message}</p>
                    <p>Redirecting back to game board...</p>
                </div>
            `;
            setTimeout(() => {
                var returnPath = (square <= 5) ? '/game-board-part1.html' : '/game-board-part2.html';
                window.location.href = returnPath;
            }, 2000);
        }

        // Show debug info for development
        debugDiv.classList.remove('hidden');

        log(`=== Question Loading ===`);
        log(`Square: ${square}`);
        log(`Row: ${row}`);
        log(`Index: ${index}`);
        log(`URL: ${window.location.href}`);

        // Validate parameters
        if (isNaN(row) || isNaN(index) || isNaN(square)) {
            log('ERROR: Invalid URL parameters');
            showError('Invalid question parameters! Please try again.');
            throw new Error('Invalid parameters');
        }

        // Check if questions bank is loaded
        if (!window.QUESTIONS_BANK) {
            log('ERROR: QUESTIONS_BANK not found');
            log('Available globals: ' + Object.keys(window).filter(k => k.includes('QUEST')).join(', '));
            showError('Questions not loaded! Please refresh the page.');
            throw new Error('Questions bank not loaded');
        }

        log(`Questions bank loaded with ${Object.keys(window.QUESTIONS_BANK).length} rows`);
        log(`Available rows: ${Object.keys(window.QUESTIONS_BANK).join(', ')}`);

        // Validate row exists
        if (!window.QUESTIONS_BANK[row]) {
            log(`ERROR: Row ${row} not found in QUESTIONS_BANK`);
            showError(`Question row ${row} not found!`);
            throw new Error(`Row ${row} not found`);
        }

        log(`Row ${row} has ${window.QUESTIONS_BANK[row].length} questions`);

        // Validate question exists
        const question = window.QUESTIONS_BANK[row][index];

        if (!question) {
            log(`ERROR: Question at [${row}][${index}] not found`);
            showError(`Question not found! Row: ${row}, Index: ${index}`);
            throw new Error('Question not found');
        }

        // Validate question structure
        if (!question.prompt || !question.options || question.answer === undefined) {
            log('ERROR: Question structure invalid');
            log(JSON.stringify(question));
            showError('Question data is invalid!');
            throw new Error('Invalid question structure');
        }

        log(`✅ Question loaded: "${question.prompt}"`);
        log(`Correct answer index: ${question.answer}`);

        // Update UI with question info
        if (infoDiv) {
            infoDiv.textContent = `Square ${square} • Row ${row} • Question ${index + 1}/10`;
        }

        // Display the question
        document.getElementById('prompt').textContent = question.prompt;

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = ''; // Clear any existing content
        question.options.forEach((option, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = option;
            btn.onclick = () => checkAnswer(idx);
            optionsDiv.appendChild(btn);
        });

        
        function checkAnswer(selectedIndex) {
            const buttons = document.querySelectorAll('.option-btn');
            const resultDiv = document.getElementById('result');
            
            log(`\n=== Answer Submitted ===`);
            log(`Selected: ${selectedIndex} (${question.options[selectedIndex]})`);
            log(`Correct: ${question.answer} (${question.options[question.answer]})`);
            
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === question.answer) {
                
                buttons[selectedIndex].classList.add('correct');
                resultDiv.textContent = '✅ Correct! You earned 5 bullets! 🎯';
                resultDiv.className = 'result success';
                resultDiv.classList.remove('hidden');

                log('✅ Answer CORRECT - awarding 5 bullets');

                fetch('/api/snakes/add-bullets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ bullets: 5 })
                })
                .then(response => {
                    log(`Bullets API response: ${response.status}`);
                    if (!response.ok) {
                        log(`⚠️ Failed to award bullets (${response.status})`);
                    } else {
                        log('✅ Bullets awarded successfully');
                    }
                    return response.json();
                })
                .then(data => {
                    log(`Response data: ${JSON.stringify(data)}`);
                })
                .catch(err => {
                    log(`❌ Error awarding bullets: ${err.message}`);
                });

                setTimeout(() => {
                    var returnPath = window.location.pathname.includes('part1')
                        ? '/game-board-part1.html'
                        : '/game-board-part2.html';

                    window.location.href =
                        returnPath +
                        '?square=' + square +
                        '&result=correct';
                }, 2000);
            } else {
                
                buttons[selectedIndex].classList.add('incorrect');
                buttons[question.answer].classList.add('correct');
                resultDiv.textContent = '❌ Incorrect. The correct answer was: ' + question.options[question.answer];
                resultDiv.className = 'result failure';
                resultDiv.classList.remove('hidden');

                log('❌ Answer INCORRECT');

                setTimeout(() => {
                    var returnPath = (square <= 5) ? '/game-board-part1.html' : '/game-board-part2.html';
                    window.location.href = returnPath;
                }, 3000);
            }
        }

        console.log('%c=== Question Debug Info ===', 'color: blue; font-weight: bold');
        console.log('Square:', square);
        console.log('Row:', row);
        console.log('Index:', index);
        console.log('Question:', question);
        console.log('Questions Bank:', window.QUESTIONS_BANK);
    </script>
</body>
</html>
