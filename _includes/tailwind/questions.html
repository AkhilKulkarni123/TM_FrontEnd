
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Time!</title>
    <link rel="stylesheet" href="../../css/snakes-game.css">
    <style>
        body {
            padding: 20px;
        }
        .question-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .question-prompt {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 1em;
        }
        .option-btn:hover {
            background: #e8ebff;
            border-color: #667eea;
        }
        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        .option-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
        }
        .result.failure {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="question-container">
        <h2>Question Time! 🎯</h2>
        <div id="question-display">
            <p class="question-prompt" id="prompt">Loading question...</p>
            <div class="options" id="options"></div>
        </div>
        <div id="result" class="result hidden"></div>
    </div>

    <!-- Load the questions bank -->
    <script src="../../js/questions_bank.js"></script>
    <script src="../../js/snakes-game.js"></script>
    
    <script>
        // Get question parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const row = parseInt(urlParams.get('row')) || 1;  // Which lesson row (1-5)
        const index = parseInt(urlParams.get('index')) || 0;  // Which question (0-4)
        const square = parseInt(urlParams.get('square')) || 26;  // Current square number

        // Load the question
        const question = window.QUESTIONS_BANK[row][index];

        if (!question) {
            alert('Question not found!');
            window.history.back();
        }

        // Display the question
        document.getElementById('prompt').textContent = question.prompt;

        const optionsDiv = document.getElementById('options');
        question.options.forEach((option, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = option;
            btn.onclick = () => checkAnswer(idx);
            optionsDiv.appendChild(btn);
        });

        // Check the answer
        function checkAnswer(selectedIndex) {
            const buttons = document.querySelectorAll('.option-btn');
            const resultDiv = document.getElementById('result');
            
            // Disable all buttons
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === question.answer) {
                // Correct answer
                buttons[selectedIndex].classList.add('correct');
                resultDiv.textContent = '✅ Correct! You earned 2 bullets! 🎯';
                resultDiv.className = 'result success';
                resultDiv.classList.remove('hidden');

                // Award bullets
                fetch('http://localhost:8001/api/snakes/add-bullets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ bullets: 2 })
                });

                // Return to game after 2 seconds
                setTimeout(() => {
                    window.location.href = '../game-board-part2.html';
                }, 2000);
            } else {
                // Wrong answer
                buttons[selectedIndex].classList.add('incorrect');
                buttons[question.answer].classList.add('correct');
                resultDiv.textContent = '❌ Incorrect. The correct answer was: ' + question.options[question.answer];
                resultDiv.className = 'result failure';
                resultDiv.classList.remove('hidden');

                // Return to game after 3 seconds
                setTimeout(() => {
                    window.location.href = '../game-board-part2.html';
                }, 3000);
            }
        }
    </script>
</body>
</html>
